# DEVELOPMENT

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: smart_water_purifier_api_dev
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  mqtt-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: smart_water_purifier_mqtt_worker_dev
    volumes:
      - .:/app
    command: python scripts/run_mqtt_worker.py
    restart: unless-stopped

  alert-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: smart_water_purifier_alert_worker_dev
    volumes:
      - .:/app
    command: python scripts/run_alert_worker.py
    restart: unless-stopped

  db:
    container_name: smart_water_purifier_db_dev
    ports:
      - "${POSTGRES_PORT}:5432"
    restart: unless-stopped

  redis:
    container_name: smart_water_purifier_redis_dev
    ports:
      - "${REDIS_PORT}:6379"
    restart: unless-stopped

  mqtt:
    container_name: smart_water_purifier_mqtt_dev
    ports:
      - "${MQTT_PORT}:1883"
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: smart_water_purifier_adminer_dev
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      - db
    restart: unless-stopped

  prometheus:
    container_name: smart_water_purifier_prometheus_dev
    ports:
      - "9090:9090"

  grafana:
    container_name: smart_water_purifier_grafana_dev
    ports:
      - "3001:3000"
